<script>
(function(){
var ctx,master,lp,timer,on=false,step=0;
var chords=[[110,164.81,196,246.94,261.63],[87.31,130.81,164.81,220,261.63],[130.81,196,246.94,329.63],[82.41,123.47,146.83,196,246.94]];
var bells=[440,523.25,659.25,783.99,880];
function impulse(){var len=ctx.sampleRate*3,b=ctx.createBuffer(2,len,ctx.sampleRate);for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}return b;}
function setup(){
ctx=new(window.AudioContext||window.webkitAudioContext)();
master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
var dry=ctx.createGain();dry.gain.value=.6;
var wet=ctx.createGain();wet.gain.value=.9;
var cv=ctx.createConvolver();cv.buffer=impulse();
lp.connect(dry);dry.connect(master);lp.connect(cv);cv.connect(wet);wet.connect(master);
}
function tone(f,t,dur,vol,type,att){
var o=ctx.createOscillator(),g=ctx.createGain();
o.type=type;o.frequency.value=f;o.detune.value=(Math.random()-.5)*14;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur+.1);
}
function bar(){
var t=ctx.currentTime+.05,ch=chords[step%chords.length];step++;
ch.forEach(function(f,i){tone(f,t,9,i===0?.09:.05,i===0?'sine':'triangle',2.5);});
for(var k=0;k<4;k++){tone(bells[Math.floor(Math.random()*bells.length)],t+1+Math.random()*6,4,.035,'sine',.02);}
}
function set(v){
var b=document.getElementById('play');
b.classList.toggle('on',v);b.setAttribute('aria-pressed',v?'true':'false');
document.getElementById('lbl').textContent=v?'pause':'play the vibe';
}
function toggle(){
try{
if(!ctx)setup();
ctx.resume();
if(!on){on=true;bar();timer=setInterval(bar,8000);master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(.8,ctx.currentTime+3);}
else{on=false;clearInterval(timer);master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+1.2);}
set(on);
}catch(e){}
}
document.getElementById('play').addEventListener('click',toggle);
})();
</script>
